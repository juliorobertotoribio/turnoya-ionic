<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content">
      <ion-header>
        <ion-toolbar color="primary">
          <ion-title>Turno Ya</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <ion-list>
          <ion-menu-toggle [autoHide]="false">
            <ion-item routerLink="/home" routerDirection="root" routerLinkActive="selected" lines="none" detail="false">
              <ion-icon slot="start" name="home-outline"></ion-icon>
              <ion-label>Inicio</ion-label>
            </ion-item>
          </ion-menu-toggle>
          <ion-menu-toggle [autoHide]="false">
            <ion-item routerLink="/servicios" routerDirection="root" routerLinkActive="selected" lines="none" detail="false">
              <ion-icon slot="start" name="list-outline"></ion-icon>
              <ion-label>Servicios</ion-label>
            </ion-item>
          </ion-menu-toggle>
          <ion-menu-toggle [autoHide]="false">
            <ion-item routerLink="/perfil" routerDirection="root" routerLinkActive="selected" lines="none" detail="false">
              <ion-icon slot="start" name="person-outline"></ion-icon>
              <ion-label>Perfil</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
