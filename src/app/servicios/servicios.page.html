<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Servicios</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  @for (s of servicios; track s.id) {
    <ion-card>
      <ion-card-header>
        <ion-card-title>{{ s.nombre }}</ion-card-title>
        <ion-card-subtitle>{{ s.precio }}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        {{ s.detalle }}
        <ion-button expand="block" routerLink="/home">Reservar</ion-button>
      </ion-card-content>
    </ion-card>
  }

  <ion-list>
    @for (h of horarios; track h.dia) {
      <ion-item>
        <ion-label>
          <h3>{{ h.dia }}</h3>
          <p>{{ h.hora }}</p>
        </ion-label>
      </ion-item>
    }
  </ion-list>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button routerLink="/home">
      <ion-icon name="calendar"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
