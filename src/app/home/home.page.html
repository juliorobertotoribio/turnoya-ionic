<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Mis citas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="refrescar($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-list>
    @for (cita of citas; track cita.id) {
      <ion-item-sliding>
        <ion-item
          (pointerdown)="iniciarPresion($event, cita)"
          (pointermove)="moverPresion($event)"
          (pointerup)="cancelarPresion()"
          (pointercancel)="cancelarPresion()"
          (pointerleave)="cancelarPresion()"
          (contextmenu)="$event.preventDefault()"
        >
          <ion-label>
            <h2>{{ cita.servicio }}</h2>
            <p>{{ cita.fecha }}</p>
          </ion-label>
        </ion-item>
        <ion-item-options side="end">
          <ion-item-option color="danger" (click)="eliminar(cita.id)">
            <ion-icon slot="icon-only" name="trash"></ion-icon>
          </ion-item-option>
        </ion-item-options>
      </ion-item-sliding>
    }
  </ion-list>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="agregar()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <ion-action-sheet
    [isOpen]="menuAbierto"
    header="Opciones de la cita"
    [buttons]="botonesMenu"
    (didDismiss)="menuAbierto = false"
  ></ion-action-sheet>
</ion-content>
