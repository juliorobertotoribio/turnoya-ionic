<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Turno Ya Barbería</ion-card-title>
      <ion-card-subtitle>Pellizca la imagen para hacer zoom</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <div
        class="zoom-contenedor"
        (pointerdown)="tocar($event)"
        (pointermove)="mover($event)"
        (pointerup)="soltar($event)"
        (pointercancel)="soltar($event)"
        (wheel)="rueda($event)"
      >
        <img
          src="assets/negocios.svg"
          alt="Fachada del negocio"
          [style.transform]="'scale(' + escala + ')'"
        />
      </div>
      <div class="botones-zoom">
        <ion-button size="small" (click)="reducir()">−</ion-button>
        <ion-button size="small" fill="outline" (click)="restablecer()">Restablecer</ion-button>
        <ion-button size="small" (click)="ampliar()">+</ion-button>
      </div>
    </ion-card-content>
  </ion-card>

  <ion-list>
    <ion-item>
      <ion-icon slot="start" name="call-outline"></ion-icon>
      <ion-label>809-555-0123</ion-label>
    </ion-item>
    <ion-item>
      <ion-icon slot="start" name="mail-outline"></ion-icon>
      <ion-label>contacto@turnoya.do</ion-label>
    </ion-item>
    <ion-item>
      <ion-icon slot="start" name="location-outline"></ion-icon>
      <ion-label>Santiago de los Caballeros</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
